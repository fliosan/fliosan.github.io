name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset versions (cache busting)
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s|href=\"/styles.css\"|href=\"/styles.css?v=$V\"|; s|src=\"/script.js\"|src=\"/script.js?v=$V\"|; s|src=\"/i18n.js\"|src=\"/i18n.js?v=$V\"|" docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
